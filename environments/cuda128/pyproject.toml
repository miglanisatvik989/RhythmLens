[project]
name = "rhythmlens-cuda128-environment"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
# Install the editable root package separately with --no-deps after sync.
dependencies = [
  "build>=1.2,<2",
  "hatchling==1.27.0",
  "matplotlib>=3.10,<3.11",
  "numpy>=2.2,<2.3",
  "pandas>=2.2,<2.3",
  "pytest>=8.3,<9",
  "pyyaml>=6,<7",
  "ruff>=0.11,<0.12",
  "scikit-learn>=1.6,<1.7",
  "scipy>=1.15,<1.16",
  "wfdb>=4.3,<4.4",
  "torch==2.8.0+cu128",
  "editables==0.5",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Preserve existing non-Torch versions from the CPU lock.
constraint-dependencies = [
  "aiohappyeyeballs==2.7.1",
  "aiohttp==3.14.5",
  "aiosignal==1.4.0",
  "attrs==26.1.0",
  "build==1.6.1",
  "certifi==2026.7.22",
  "cffi==2.1.1",
  "charset-normalizer==3.5.2",
  "cloudpickle==3.1.2",
  "colorama==0.4.6",
  "contourpy==1.3.3",
  "cycler==0.12.1",
  "filelock==4.1.1",
  "fonttools==4.66.1",
  "frozenlist==1.8.0",
  "fsspec==2026.9.0",
  "hatchling==1.27.0",
  "idna==3.20",
  "iniconfig==2.3.1",
  "jinja2==3.1.6",
  "joblib==1.6.0",
  "kiwisolver==1.5.1",
  "markupsafe==3.0.4",
  "matplotlib==3.10.9",
  "mpmath==1.3.0",
  "multidict==7.1.0",
  "networkx==3.6.1",
  "numpy==2.2.6",
  "packaging==26.3",
  "pandas==2.2.3",
  "pathspec==1.1.1",
  "pillow==12.3.0",
  "pluggy==1.6.0",
  "propcache==0.5.4",
  "pycparser==3.11",
  "pygments==2.21.0",
  "pyparsing==3.3.3",
  "pyproject-hooks==1.3.3",
  "pytest==8.4.2",
  "python-dateutil==2.9.0.post0",
  "pytz==2026.5",
  "pyyaml==6.0.3",
  "requests==2.34.2",
  "ruff==0.11.13",
  "scikit-learn==1.6.1",
  "scipy==1.15.3",
  "six==1.17.0",
  "soundfile==0.14.0",
  "sympy==1.14.0",
  "threadpoolctl==3.7.0",
  "trove-classifiers==2026.9.21.13",
  "typing-extensions==4.16.0",
  "tzdata==2026.5",
  "urllib3==2.8.0",
  "wfdb==4.3.1",
  "yarl==1.25.1",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
